<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cart | Glassify</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header glass"><a class="logo" href="index.html"><span>G</span>lassify</a><nav class="desktop-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a></nav><a class="cart-pill" href="cart.html">Cart <b id="cartCount">0</b></a></header><main><section class="section"><span class="eyebrow">YOUR BAG</span><h1 style="font-size:clamp(45px,6vw,70px)">Shopping <em>cart.</em></h1><div id="cartItems" class="glass" style="border-radius:24px;padding:25px;margin-top:25px"></div><div style="margin-top:20px;display:flex;justify-content:space-between;align-items:center"><h2>Total: $<span id="cartTotal">0</span></h2><a class="btn btn-primary" href="shop.html">Continue Shopping</a></div></section></main><script src="script.js"></script><script src="cart.js"></script><script>function renderCart(){const c=getCart(),box=document.getElementById("cartItems"),total=c.reduce((s,i)=>s+i.price*i.qty,0);document.getElementById("cartTotal").textContent=total.toFixed(2);if(!c.length){box.innerHTML="<p style='color:var(--muted)'>Your cart is empty. <a href='shop.html' style='color:var(--accent)'>Start shopping →</a></p>";return}box.innerHTML=c.map((i,n)=>`<div style="display:flex;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid var(--border)"><div><b>${i.name}</b><small style="display:block;color:var(--muted);margin-top:5px">$${i.price} × ${i.qty}</small></div><button onclick="removeItem(${n})" style="color:#ff8ba7">Remove</button></div>`).join("")}function removeItem(n){const c=getCart();c.splice(n,1);saveCart(c);renderCart()}document.addEventListener("DOMContentLoaded",renderCart)</script></body></html>
